<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>コンコン サイコロ</title>

<style>
    body {
        margin: 0;
        font-family: sans-serif;
        background: #f2f2f2;
        text-align: center;
    }

    h1 {
        margin-top: 40px;
        font-size: 32px;
    }

    #dice {
        width: 180px;
        height: 180px;
        margin: 40px auto;
        background: white;
        border-radius: 25px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 100px;
        font-weight: bold;
    }

    button {
        font-size: 28px;
        padding: 15px 50px;
        border: none;
        border-radius: 15px;
        background: #333;
        color: white;
        cursor: pointer;
    }

    button:active {
        transform: scale(0.95);
    }

    #message {
        margin-top: 25px;
        font-size: 20px;
    }
</style>
</head>

<body>

<h1>🎲 コンコン サイコロ</h1>

<div id="dice">⚀</div>

<button onclick="rollDice()">ふる！</button>

<div id="message">ボタンを押してね</div>

<script>

function rollDice() {

    // 1～6のランダムな数字
    const number = Math.floor(Math.random() * 6) + 1;

    // サイコロのUnicode文字
    const dice = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    // 表示
    document.getElementById("dice").textContent = dice[number - 1];

    document.getElementById("message").textContent =
        number + " が出ました！";
}

</script>

</body>
</html>
